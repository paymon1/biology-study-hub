site_name: زیست‌یار | پایگاه آموزش زیست‌شناسی
site_description: درس‌نامه، یادگیری دیداری، تمرین و فلش‌کارت زیست‌شناسی دهم، یازدهم و دوازدهم
site_url: https://paymon1.github.io/biology-study-hub/
site_author: Biology Study Hub
copyright: محتوای تألیفی آموزشی؛ برای منابع بیرونی به ارجاع هر صفحه مراجعه کنید.

docs_dir: site_docs
site_dir: site

theme:
  name: material
  language: fa
  direction: rtl
  icon:
    logo: material/dna
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: تغییر به حالت تاریک
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: تغییر به حالت روشن
  font: false

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - assets/stylesheets/extra.css
extra_javascript:
  - assets/javascripts/flashcards.js

